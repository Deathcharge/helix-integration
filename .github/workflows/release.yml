name: Publish Python release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_release.py "$RELEASE_TAG"
      - name: Verify the tag targets the current main commit
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build==1.5.0 twine==7.0.0
      - name: Build distributions
        run: python -m build
      - name: Verify distribution contents and metadata
        run: |
          python scripts/verify_distribution.py dist
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m pip install --disable-pip-version-check --no-deps --force-reinstall dist/*.whl
          samsarix-guard --version
          samsarix-guard redact examples/sample-event.json --output sanitized.json
          samsarix-guard scan sanitized.json
      - name: Record SHA-256 checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Store verified distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/samsarix-integration-guard
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  attach-to-github:
    name: Attach verified distributions to GitHub
    needs: [build, publish-to-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
      - name: Attach distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")" = "true"
          gh release upload "$TAG_NAME" dist/* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG_NAME" --draft=false --latest --verify-tag --repo "$GITHUB_REPOSITORY"
